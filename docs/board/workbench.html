<title>Buddy Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a maker's pegboard — "resume here" project cards on top, then five task columns that wrap to one column on a phone. Projects carry their own hue. */
:root {
  --bg: #e9edf1;
  --panel: #f6f8fa;
  --card: #ffffff;
  --fg: #18212b;
  --dim: #5b6876;
  --line: #cfd7df;
  --accent: #1f6feb;
  --accent-fg: #ffffff;
  --warn: #b4560c;
  --danger: #c0352b;
  --chip-s: 62%;
  --chip-l: 38%;
  --chip-mix: 14%;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --panel: #171e26; --card: #1f2832; --fg: #e6ecf2; --dim: #93a1b0; --line: #2c3845;
  --accent: #5b9cff; --accent-fg: #0b1220; --warn: #f0a250; --danger: #ff7b6e;
  --chip-s: 70%; --chip-l: 72%; --chip-mix: 20%; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161c; --panel: #171e26; --card: #1f2832; --fg: #e6ecf2; --dim: #93a1b0; --line: #2c3845;
  --accent: #5b9cff; --accent-fg: #0b1220; --warn: #f0a250; --danger: #ff7b6e;
  --chip-s: 70%; --chip-l: 72%; --chip-mix: 20%; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.wrap { max-width: 1500px; margin: 0 auto; display: grid; gap: 18px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font: 800 clamp(26px, 4vw, 38px)/1 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--dim); margin: 6px 0 0; max-width: 60ch; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools select { width: auto; min-width: 180px; }

button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--card); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--dim); padding-inline: 6px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.chip { --c: hsl(var(--h, 210) var(--chip-s) var(--chip-l)); display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600;
  color: var(--c); background: color-mix(in srgb, var(--c) var(--chip-mix), transparent); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chip.gray { --c: var(--dim); }

/* project strip */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-head h2 { font: 700 20px var(--display); margin: 0; }
.areas { display: grid; gap: 14px; }
.area h3 { margin: 0 0 6px; font: 600 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.projects { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.proj { --c: hsl(var(--h, 210) var(--chip-s) var(--chip-l)); text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
  display: grid; gap: 6px; color: var(--fg); min-width: 0; align-content: start; }
.proj:hover { border-color: var(--c); }
.proj .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.proj .name { font: 700 16px var(--display); color: var(--c); overflow-wrap: anywhere; }
.proj .when { font: 500 11.5px var(--mono); color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.proj .when.stale { color: var(--warn); }
.proj .lbl { font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.proj .txt { font-size: 13.5px; overflow-wrap: anywhere; }
.proj .next { font-weight: 600; }
.proj .wait { font-size: 12.5px; color: var(--warn); }

.board { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); align-items: start; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.col.over { border-color: var(--accent); }
.col-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.col-head h2 { font: 700 18px/1.1 var(--display); margin: 0; }
.count { font: 500 12px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.count.over { color: var(--warn); }
.hint { margin: -4px 0 0; color: var(--dim); font-size: 12.5px; }
.list { display: grid; gap: 8px; min-height: 40px; }
.empty { color: var(--dim); font-size: 13px; border: 1px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; }

.task { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; display: grid; gap: 7px; text-align: left; color: var(--fg); width: 100%; min-width: 0; }
.task:hover { border-color: var(--dim); }
.task.dragging { opacity: 0.45; }
.task.drop-before { box-shadow: 0 -3px 0 var(--accent); }
.task .t { font-weight: 600; overflow-wrap: anywhere; }
.task .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.task .notes-mark { font: 500 11.5px var(--mono); color: var(--dim); }
.col[data-col="done"] .task .t, .col[data-col="dropped"] .task .t { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--line); }
.col[data-col="dropped"] { border-style: dashed; }

.status { color: var(--dim); font-size: 13px; margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg);
  padding: 9px 14px; border-radius: 8px; font-size: 13.5px; max-width: calc(100% - 32px); z-index: 20; }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--fg); padding: 0; width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); }
dialog::backdrop { background: color-mix(in srgb, #000 45%, transparent); }
.dlg { display: grid; gap: 12px; padding: 18px; }
.dlg h3 { font: 700 20px var(--display); margin: 0; }
.dlg .what { color: var(--dim); margin: -6px 0 0; font-size: 14px; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--dim); }
label.check { display: flex; align-items: center; gap: 8px; }
label.check input { width: auto; }
input, select, textarea { font: 15px/1.4 var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 80px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.actions .right { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .task, .proj { transition: border-color .15s, opacity .15s; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Buddy Workbench</h1>
      <p class="sub">Projects, home and life in one place. Keep <strong>Now</strong> short; park new ideas in <strong>Ideas</strong>; before you stop, update the project's <strong>left off</strong> line.</p>
    </div>
    <div class="tools">
      <label for="filter" class="sr" hidden>Project</label>
      <select id="filter" aria-label="Show tasks for"></select>
      <button class="btn primary" id="add-btn" type="button">+ Add task</button>
    </div>
  </header>

  <section aria-labelledby="proj-h">
    <div class="section-head">
      <h2 id="proj-h">Resume here</h2>
      <button class="btn ghost" id="proj-toggle" type="button" aria-expanded="true">Hide</button>
    </div>
    <div class="areas" id="areas"></div>
  </section>

  <p class="status" id="status">Loading your board…</p>
  <main class="board" id="board"></main>
  <div><button class="btn ghost" id="dropped-toggle" type="button">Show won't-do</button></div>
</div>

<dialog id="dlg">
  <form class="dlg" id="form" method="dialog">
    <h3 id="dlg-title">Add task</h3>
    <label>Task<input id="f-title" required maxlength="160" autocomplete="off"></label>
    <div class="row2">
      <label>Project<select id="f-project"></select></label>
      <label>Column<select id="f-col"></select></label>
    </div>
    <label>Notes<textarea id="f-notes" maxlength="4000" placeholder="Steps, links, measurements…"></textarea></label>
    <div class="actions">
      <button class="btn danger" id="f-delete" type="button" hidden>Delete</button>
      <div class="right">
        <button class="btn" id="f-cancel" type="button">Cancel</button>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="pdlg">
  <form class="dlg" id="pform" method="dialog">
    <h3 id="p-name">Project</h3>
    <p class="what" id="p-what"></p>
    <label>Status<input id="p-status" maxlength="200" autocomplete="off"></label>
    <label>Where I left off<textarea id="p-left" maxlength="1000"></textarea></label>
    <label>Next step<textarea id="p-next" maxlength="600" style="min-height:56px"></textarea></label>
    <label>Waiting on (one per line)<textarea id="p-wait" maxlength="2000" style="min-height:56px"></textarea></label>
    <label>Decisions made (one per line)<textarea id="p-dec" maxlength="4000"></textarea></label>
    <label>Details to remember (one per line)<textarea id="p-det" maxlength="4000"></textarea></label>
    <label class="check"><input type="checkbox" id="p-drop"> Won't do: hide this project and its tasks</label>
    <div class="actions">
      <button class="btn" id="p-show" type="button">Show its tasks</button>
      <div class="right">
        <button class="btn" id="p-cancel" type="button">Cancel</button>
        <button class="btn primary" type="submit">Save · touched today</button>
      </div>
    </div>
  </form>
</dialog>

<script>
const COLS = [
  { id: "now", name: "Now", hint: "This week. Keep it to 3.", limit: 3 },
  { id: "next", name: "Next", hint: "Up after Now, roughly in order." },
  { id: "later", name: "Later", hint: "Planned, not yet." },
  { id: "ideas", name: "Ideas", hint: "Parked. No pressure." },
  { id: "done", name: "Done", hint: "Finished." },
];
const DROPPED = { id: "dropped", name: "Won't do", hint: "Decided not to, or parked for good. Kept so you know you thought of it." };
const AREAS = [["hardware", "Hardware"], ["apps", "Apps"], ["cards", "Cards"], ["life", "Life"]];

const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let db = null, tasks = [], projects = {}, filter = store.get("wb-filter", "all"), editing = null, editingProj = null, dragId = null;
let showDropped = false, projOpen = store.get("wb-proj", "1") === "1";

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
const lines = (v) => (Array.isArray(v) ? v : []).join("\n");
const unlines = (s) => s.split("\n").map((x) => x.trim()).filter(Boolean);
const today = () => new Date().toISOString().slice(0, 10);
const projDropped = (key) => !!(projects[key] && projects[key].dropped);
const isHidden = (t) => t.column === "dropped" || projDropped(t.project);

function chip(key) {
  const p = projects[key], s = document.createElement("span");
  s.className = "chip" + (p ? "" : " gray");
  if (p) s.style.setProperty("--h", p.hue ?? 210);
  s.textContent = p ? p.name : key || "Other";
  return s;
}

function daysAgo(d) {
  if (!d) return null;
  const t = Date.parse(d + "T00:00:00"); if (isNaN(t)) return null;
  return Math.max(0, Math.round((Date.now() - t) / 864e5));
}

function sortedProjects(includeDropped) {
  return Object.values(projects).filter((p) => includeDropped || !p.dropped)
    .sort((a, b) => (b.lastTouched || "").localeCompare(a.lastTouched || "") || a.name.localeCompare(b.name));
}

function renderFilter() {
  const sel = $("filter"), cur = filter;
  const opts = [new Option("All projects", "all")];
  for (const p of sortedProjects(showDropped).slice().sort((a, b) => a.name.localeCompare(b.name))) opts.push(new Option(p.name + (p.dropped ? " (won't do)" : ""), p.id));
  sel.replaceChildren(...opts);
  sel.value = [...sel.options].some((o) => o.value === cur) ? cur : "all";
  filter = sel.value;
  $("f-project").replaceChildren(...Object.values(projects).filter((p) => !p.dropped).sort((a, b) => a.name.localeCompare(b.name)).map((p) => new Option(p.name, p.id)));
}

function renderProjects() {
  const box = $("areas"); box.replaceChildren();
  $("proj-toggle").textContent = projOpen ? "Hide" : "Show";
  $("proj-toggle").setAttribute("aria-expanded", String(projOpen));
  if (!projOpen) return;
  const all = sortedProjects(showDropped);
  if (!all.length) { const e = document.createElement("p"); e.className = "status"; e.textContent = "No projects yet."; box.appendChild(e); return; }
  for (const [area, label] of AREAS) {
    const ps = all.filter((p) => (p.area || "life") === area); if (!ps.length) continue;
    const sec = document.createElement("div"); sec.className = "area";
    const h = document.createElement("h3"); h.textContent = label;
    const grid = document.createElement("div"); grid.className = "projects";
    for (const p of ps) grid.appendChild(projEl(p));
    sec.append(h, grid); box.appendChild(sec);
  }
}

function projEl(p) {
  const b = document.createElement("button"); b.type = "button"; b.className = "proj"; b.style.setProperty("--h", p.hue ?? 210);
  if (p.dropped) b.style.opacity = "0.6";
  const top = document.createElement("div"); top.className = "top";
  const n = document.createElement("span"); n.className = "name"; n.textContent = p.name;
  const w = document.createElement("span"); w.className = "when";
  const d = daysAgo(p.lastTouched);
  w.textContent = d === null ? "—" : d === 0 ? "today" : d === 1 ? "yesterday" : d + "d ago";
  if (d !== null && d > 21) w.classList.add("stale");
  top.append(n, w); b.appendChild(top);
  const add = (lbl, text, cls) => {
    if (!text) return;
    const l = document.createElement("span"); l.className = "lbl"; l.textContent = lbl;
    const t = document.createElement("span"); t.className = "txt" + (cls ? " " + cls : ""); t.textContent = text;
    b.append(l, t);
  };
  add("Left off", p.leftOff);
  add("Next", p.nextStep, "next");
  if (Array.isArray(p.blockers) && p.blockers.length) {
    const wt = document.createElement("span"); wt.className = "wait"; wt.textContent = "Waiting: " + p.blockers.join("; "); b.appendChild(wt);
  }
  b.onclick = () => openProject(p);
  return b;
}

function sorted(col) {
  return tasks.filter((t) => (col === "dropped" ? isHidden(t) : t.column === col && !isHidden(t)) && (filter === "all" || t.project === filter))
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
}

function renderBoard() {
  const board = $("board"); board.replaceChildren();
  const cols = showDropped ? [...COLS, DROPPED] : COLS;
  for (const c of cols) {
    const items = sorted(c.id);
    const total = c.limit ? tasks.filter((t) => t.column === c.id && !isHidden(t)).length : items.length;
    const col = document.createElement("section");
    col.className = "col"; col.dataset.col = c.id; col.setAttribute("aria-label", c.name);
    const head = document.createElement("div"); head.className = "col-head";
    const h = document.createElement("h2"); h.textContent = c.name;
    const n = document.createElement("span");
    n.className = "count" + (c.limit && total > c.limit ? " over" : "");
    n.textContent = c.limit ? `${total} / ${c.limit}` : String(items.length);
    if (c.limit && total > c.limit) n.title = "More than " + c.limit + ": move something back to Next";
    head.append(h, n);
    const hint = document.createElement("p"); hint.className = "hint"; hint.textContent = c.hint;
    const list = document.createElement("div"); list.className = "list";
    if (!items.length) {
      const e = document.createElement("div"); e.className = "empty";
      e.textContent = filter === "all" ? "Nothing here" : "Nothing for this project";
      list.appendChild(e);
    }
    for (const t of items) list.appendChild(taskEl(t));
    col.append(head, hint, list);
    col.addEventListener("dragover", (e) => { if (dragId) { e.preventDefault(); col.classList.add("over"); } });
    col.addEventListener("dragleave", (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove("over"); });
    col.addEventListener("drop", (e) => { e.preventDefault(); col.classList.remove("over"); if (dragId) moveTo(dragId, c.id, null); });
    board.appendChild(col);
  }
  const hiddenCount = tasks.filter(isHidden).length;
  $("dropped-toggle").textContent = showDropped ? "Hide won't-do" : `Show won't-do (${hiddenCount})`;
}

function taskEl(t) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "task"; b.draggable = true; b.dataset.id = t.id;
  const title = document.createElement("span"); title.className = "t"; title.textContent = t.title;
  const meta = document.createElement("span"); meta.className = "meta";
  meta.appendChild(chip(t.project));
  if (t.notes) { const m = document.createElement("span"); m.className = "notes-mark"; m.textContent = "notes"; meta.appendChild(m); }
  b.append(title, meta);
  b.onclick = () => openDialog(t);
  b.addEventListener("dragstart", (e) => { dragId = t.id; b.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", t.id); });
  b.addEventListener("dragend", () => { dragId = null; b.classList.remove("dragging"); });
  b.addEventListener("dragover", (e) => { if (dragId && dragId !== t.id) { e.preventDefault(); b.classList.add("drop-before"); } });
  b.addEventListener("dragleave", () => b.classList.remove("drop-before"));
  b.addEventListener("drop", (e) => {
    e.preventDefault(); e.stopPropagation(); b.classList.remove("drop-before");
    b.closest(".col")?.classList.remove("over");
    if (dragId && dragId !== t.id) moveTo(dragId, t.column, t.id);
  });
  return b;
}

function orderFor(col, beforeId, movingId) {
  const list = tasks.filter((t) => t.column === col && t.id !== movingId).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  if (!beforeId) return list.length ? (list[list.length - 1].order ?? 0) + 1 : 1;
  const i = list.findIndex((t) => t.id === beforeId);
  if (i < 0) return list.length ? (list[list.length - 1].order ?? 0) + 1 : 1;
  const next = list[i].order ?? 0, prev = i > 0 ? (list[i - 1].order ?? 0) : next - 1;
  return (prev + next) / 2;
}

async function write(fn, okMsg) {
  if (!db) { toast("Saving isn't available in this view."); return false; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const code = e && e.code;
    toast(code === "invalid_argument" ? "This board is read-only for you." :
          code === "quota_exceeded" ? "The board is full. Delete some done tasks first." :
          "Couldn't save. Check your connection and try again.");
    return false;
  }
}

function touch(key) {
  const p = projects[key]; if (!p || p.lastTouched === today()) return;
  p.lastTouched = today();
  write(() => db.doc("projects/" + key).update({ lastTouched: p.lastTouched }));
}

function moveTo(id, col, beforeId) {
  const t = tasks.find((x) => x.id === id); if (!t) return;
  const patch = { column: col, order: orderFor(col, beforeId, id) };
  if (col === "done" && t.column !== "done") patch.doneAt = Date.now();
  Object.assign(t, patch); renderBoard();
  write(() => db.doc("tasks/" + id).update(patch));
  if (col !== t.column || col === "done") touch(t.project);
}

function openDialog(t) {
  editing = t || null;
  $("dlg-title").textContent = t ? "Edit task" : "Add task";
  $("f-col").replaceChildren(...[...COLS, DROPPED].map((c) => new Option(c.name, c.id)));
  $("f-title").value = t ? t.title : "";
  const fallback = filter !== "all" && projects[filter] && !projects[filter].dropped ? filter : (projects.sortbuddy ? "sortbuddy" : Object.keys(projects)[0] || "");
  if (t && projects[t.project] && projDropped(t.project)) $("f-project").append(new Option(projects[t.project].name, t.project));
  $("f-project").value = t ? t.project : fallback;
  $("f-col").value = t ? t.column : "ideas";
  $("f-notes").value = t ? (t.notes || "") : "";
  const del = $("f-delete"); del.hidden = !t; del.classList.remove("armed"); del.textContent = "Delete";
  $("dlg").showModal(); $("f-title").focus();
}

function openProject(p) {
  editingProj = p;
  $("p-name").textContent = p.name; $("p-name").style.color = `hsl(${p.hue ?? 210} var(--chip-s) var(--chip-l))`;
  $("p-what").textContent = p.what || "";
  $("p-status").value = p.status || "";
  $("p-left").value = p.leftOff || "";
  $("p-next").value = p.nextStep || "";
  $("p-wait").value = lines(p.blockers);
  $("p-dec").value = lines(p.decisions);
  $("p-det").value = lines(p.details);
  $("p-drop").checked = !!p.dropped;
  $("pdlg").showModal();
}

$("filter").onchange = (e) => { filter = e.target.value; store.set("wb-filter", filter); renderBoard(); };
$("proj-toggle").onclick = () => { projOpen = !projOpen; store.set("wb-proj", projOpen ? "1" : "0"); renderProjects(); };
$("dropped-toggle").onclick = () => { showDropped = !showDropped; renderFilter(); renderProjects(); renderBoard(); };
$("add-btn").onclick = () => openDialog(null);
$("f-cancel").onclick = () => $("dlg").close();
$("p-cancel").onclick = () => $("pdlg").close();
$("p-show").onclick = () => { $("pdlg").close(); filter = editingProj.id; store.set("wb-filter", filter); if (editingProj.dropped) showDropped = true; renderFilter(); renderBoard(); $("board").scrollIntoView({ behavior: "smooth" }); };
$("f-delete").onclick = async () => {
  const del = $("f-delete");
  if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "Tap again to delete"; return; }
  const id = editing.id; $("dlg").close();
  tasks = tasks.filter((x) => x.id !== id); renderBoard();
  await write(() => db.doc("tasks/" + id).delete(), "Deleted");
};
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const title = $("f-title").value.trim(); if (!title) return;
  const body = { title, project: $("f-project").value, column: $("f-col").value, notes: $("f-notes").value.trim() };
  $("dlg").close();
  if (editing) {
    if (body.column !== editing.column) {
      body.order = orderFor(body.column, null, editing.id);
      if (body.column === "done") body.doneAt = Date.now();
    }
    const id = editing.id; Object.assign(editing, body); renderBoard();
    await write(() => db.doc("tasks/" + id).update(body), "Saved");
  } else {
    body.order = orderFor(body.column, null, null); body.created = Date.now();
    const col = [...COLS, DROPPED].find((c) => c.id === body.column);
    await write(() => db.collection("tasks").add(body), "Added to " + col.name);
  }
  touch(body.project);
});
$("pform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const p = editingProj, key = p.id;
  const body = { status: $("p-status").value.trim(), leftOff: $("p-left").value.trim(), nextStep: $("p-next").value.trim(),
    blockers: unlines($("p-wait").value), decisions: unlines($("p-dec").value), details: unlines($("p-det").value),
    dropped: $("p-drop").checked, lastTouched: today() };
  $("pdlg").close();
  Object.assign(p, body); renderFilter(); renderProjects(); renderBoard();
  await write(() => db.doc("projects/" + key).update(body), "Saved");
});

renderFilter(); renderProjects(); renderBoard();

(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  if (!db) { $("status").textContent = "Your board can't load in this view. Open it from claude.ai while signed in."; $("add-btn").disabled = true; return; }
  const fail = () => { $("status").hidden = false; $("status").textContent = "Lost the connection to your board. Reload the page."; };
  db.collection("projects").onSnapshot((snap) => {
    projects = Object.fromEntries(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    renderFilter(); renderProjects(); renderBoard();
  }, fail);
  db.collection("tasks").onSnapshot((snap) => {
    tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    $("status").textContent = tasks.length ? "" : "No tasks yet. Use “+ Add task” to start.";
    $("status").hidden = !!tasks.length;
    renderBoard();
  }, fail);
})();
</script>
